/* ===================== VARIABILI / BASE ===================== */
:root{
  --bg1:#EEF3FC;--bg2:#D8DFF5;--primary:#2F6BEA;--primary2:#1D45D8;--navy:#34519E;--navy2:#26407F;
  --text:#2F3858;--muted:#5F6784;--card:#FFFFFF;--ok:#16A34A;--err:#DC2647;
  --shadow:0 10px 30px rgba(45,65,130,.13);--shadow-s:0 4px 14px rgba(45,65,130,.12);
  --font:'Lexend',Verdana,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{color-scheme:light}
[hidden]{display:none!important}
html[data-font="atkinson"]{--font:'Atkinson Hyperlegible',Verdana,sans-serif}
html[data-font="opendyslexic"]{--font:'OpenDyslexic',Verdana,sans-serif}
/* Leggibilità: interlinea comoda e lettere un po' più marcate */
body{line-height:1.45;letter-spacing:.01em;font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html[data-font="opendyslexic"] body{letter-spacing:-.02em;word-spacing:-.08em}
.bubble,.instr-line{letter-spacing:.015em}
/* testi piccoli più grandi e con più contrasto */
.step-t{font-size:15px}.step{opacity:.6}
.mod-s,.free-t{font-size:15px}
.hello p,.meta{font-size:15px}
.mod-n{font-size:13px}
.task-name{font-size:16px}
@media (max-width:520px){.step-t{font-size:12px}}
body{font-family:var(--font);color:var(--text);background:linear-gradient(165deg,var(--bg1),var(--bg2));background-attachment:fixed;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input,select{font-family:inherit;color:inherit}
[disabled]{opacity:.4;pointer-events:none}
#app{max-width:1024px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-block:8px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===================== BARRA SUPERIORE ===================== */
.topbar{display:flex;align-items:center;gap:10px;flex:none}
.round-btn{width:56px;height:56px;border-radius:50%;border:none;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;flex:none}
.task-pill{flex:1;min-width:0;height:56px;background:#fff;border-radius:999px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 22px}
.task-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:5px}.seg i{flex:1;max-width:48px;height:7px;border-radius:9px;background:#C6CCDA}.seg i.on{background:var(--primary)}
.clock-pill{height:56px;background:#fff;border-radius:999px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;flex:none}
.clock-pill .ico{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#3B82F6,#1D45D8);display:grid;place-items:center}

main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 0 4px;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

/* ===================== BARRA INFERIORE ===================== */
.bottom-nav{flex:none;display:flex;justify-content:space-around;align-items:center;height:72px;margin:6px 0 10px;
  background:rgba(255,255,255,.92);border-radius:40px;box-shadow:var(--shadow)}
.nav-btn{border:none;background:none;width:80px;height:54px;border-radius:30px;display:grid;place-items:center;cursor:pointer;color:#1F2937}
.nav-btn.active{background:linear-gradient(145deg,#3B6CF6,#2442E8);color:#fff}
.nav-btn .nao-mini{width:34px;height:34px}

/* ===================== ELEMENTI COMUNI ===================== */
.hud{display:flex;justify-content:center;align-items:center;gap:10px;min-height:36px;flex:none;flex-wrap:wrap}
.mod-timer,.lvl-tag{background:#fff;border-radius:999px;padding:6px 16px;font-size:14px;box-shadow:var(--shadow-s);font-variant-numeric:tabular-nums}
.practice-tag{position:absolute;top:0;left:4px;z-index:5;background:#F59E0B;color:#fff;font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;box-shadow:var(--shadow-s)}
.instr-line{text-align:center;font-size:clamp(18px,3.4vw,28px);margin:12px 8px;color:#47516F;flex:none}
.dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:10px 0 0;flex:none}
.dot{width:32px;height:32px;border-radius:50%;background:#CBD3E1;border:2px solid #B6BFD0;display:grid;place-items:center}
.dot.ok{background:var(--ok);border-color:var(--ok)}.dot.ko{background:var(--err);border-color:var(--err)}
.btn{height:60px;min-width:200px;padding:0 28px;border:none;border-radius:22px;background:linear-gradient(160deg,#3B82F6,#1D45D8);color:#fff;font-size:20px;font-weight:700;box-shadow:0 10px 22px rgba(37,99,235,.35);cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.ghost-btn{background:#fff;color:var(--primary);box-shadow:var(--shadow-s)}
.bubble{background:#EEF3FC;border-radius:24px;padding:18px 22px;font-size:clamp(16px,2.6vw,22px);text-align:center;line-height:1.55;position:relative;max-width:640px}
.bubble::before{content:'';position:absolute;top:-12px;left:50%;margin-left:-12px;border:12px solid transparent;border-top:0;border-bottom-color:#EEF3FC}
.bubble .ii{display:inline-block;width:1.6em;height:1.6em;vertical-align:middle}
.bubble .ii svg{width:100%;height:100%}
.cw{flex:1;min-height:160px;position:relative}
.cw canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-14%)}100%{transform:translateY(0)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-20deg)}}
@keyframes fall{to{transform:translateY(460px) rotate(540deg);opacity:0}}

/* ===================== HOME ===================== */
.home{display:flex;flex-direction:column;gap:14px;padding-bottom:6px}
.hello{display:flex;align-items:center;gap:16px;background:#fff;border-radius:28px;padding:14px 20px;box-shadow:var(--shadow)}
.hello-nao{width:70px;flex:none}.hello h1{font-size:21px;margin:0}.hello p{margin:4px 0 0;color:var(--muted);font-size:14px}
.sec-title{display:flex;align-items:center;gap:10px;font-size:19px;margin:8px 4px 0}
.sec-num{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:15px}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mod-card{background:#fff;border:none;border-radius:26px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;cursor:pointer;min-height:168px}
.mod-card:active,.nao-card:active{transform:scale(.97)}
.mod-ico{width:58px;height:58px;border-radius:18px;background:linear-gradient(150deg,#3B82F6,#1D45D8);display:grid;place-items:center;color:#fff;font-size:32px;font-weight:700;margin-bottom:6px}
.mod-n{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mod-t{font-size:18px;font-weight:700}.mod-s{font-size:13px;color:var(--muted)}
.nao-card{display:flex;align-items:center;gap:18px;background:linear-gradient(140deg,#34519E,#2F6BEA);color:#fff;border:none;border-radius:28px;padding:20px;box-shadow:var(--shadow);text-align:left;cursor:pointer}
.nao-card .mod-n,.nao-card .mod-s{color:rgba(255,255,255,.82)}
.nao-card .txt{display:flex;flex-direction:column;gap:4px}
.nao-logo{width:92px;height:92px;background:#fff;border-radius:50%;padding:8px;flex:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.nao-section{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:10px}
.nao-section .nao-logo{width:min(190px,30vh);height:min(190px,30vh);padding:16px}
.nao-section h1{margin:0;font-size:clamp(24px,4vw,34px)}
.nao-section p{margin:0;max-width:560px;color:var(--muted);line-height:1.6}

/* ===================== ISTRUZIONI / PRONTO / FINE ===================== */
.instr,.ready,.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:10px;text-align:center}
.instr h2,.end h2{margin:0;font-size:clamp(22px,4vw,32px)}
.nao-body{width:min(160px,26vh)}
.nao-body svg{width:100%;height:auto;overflow:visible}
.nao-body .wave{transform-origin:126px 124px;animation:wave 1.3s ease-in-out infinite}
.ready{cursor:pointer}
.ready h2{margin:0;font-size:clamp(30px,6vw,48px);color:var(--primary2)}
.ready p{margin:0;font-size:clamp(18px,3vw,26px)}
.tap-circle{width:min(200px,28vh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 25%,#3D8BFA,#2A55E5 55%,#2338C8);display:grid;place-items:center;animation:pulse 1.4s ease-in-out infinite;box-shadow:0 0 0 18px rgba(120,140,230,.18)}

/* Voce di NAO: tra le voci italiane installate sceglie la più naturale

const TRIAL_EV = new Set(['hit','omission','commission','correct_rejection','crossing','collision','saccade_hit','saccade_omission','run']);
function summarize() {
  const out = {};

/* =====================================================================
   7. MOTORE DI ESECUZIONE (orologio attivo con pausa)
   ===================================================================== */
class ActiveClock {
  constructor() { this.acc = 0; this.t = null; }
  start() { this.t = performance.now(); }
  pause() { if (this.t !== null) { this.acc += performance.now() - this.t; this.t = null; } }
  resume() { if (this.t === null) this.t = performance.now(); }
  get() { return this.acc + (this.t !== null ? performance.now() - this.t : 0); }
}
/* Runner: gestisce tempo "attivo" del modulo (si ferma durante i messaggi di NAO),
   attese che rispettano la pausa, e la cancellazione quando si torna alla Home. */
class Runner {
  constructor() { this.clock = new ActiveClock(); this.clock.start(); this.p = 0; this.dead = false; this.cleanups = []; }
  get paused() { return this.p > 0; }
  pause() { this.p++; if (this.p === 1) this.clock.pause(); }
  resume() { if (this.p === 0) return; this.p--; if (this.p === 0 && !this.dead) this.clock.resume(); }
  now() { return this.clock.get(); }
  onDestroy(f) { this.cleanups.push(f); }
  destroy() { if (this.dead) return; this.dead = true; this.clock.pause(); this.cleanups.forEach(f => { try { f(); } catch (e) {} }); }
  every(fn) { const loop = () => { if (this.dead) return; fn(); requestAnimationFrame(loop); }; loop(); }
  /* Attende ms di tempo attivo oppure finché pred() restituisce un valore */
  waitUntil(ms, pred, onTick) {
    const start = this.now();
    return new Promise((res, rej) => {
      const tick = () => {
        if (this.dead) return rej(CANCEL);
        const v = pred && pred(); if (v) return res(v);
        const el = this.now() - start; onTick && onTick(Math.min(1, el / ms));
        if (el >= ms) return res(null);
        requestAnimationFrame(tick);
      };
      tick();
    });
  }
  wait(ms) { return this.waitUntil(ms); }
}

const MSG_OK = l => `Bravissimo! Hai superato il livello ${l}!`;
const MSG_RETRY = 'Non preoccuparti, proviamoci di nuovo!';

/* Pallini di avanzamento (verdi = corretti, rossi = errori, grigi = da fare) */
function renderDots(el, results, remaining) {

/* =====================================================================
   9. MODULO 1 – GO/NO-GO INIBITORIO ("Fase Iniziale")
   ===================================================================== */
async function runGNG(r, stage, phase, limit) {
  const C = CONFIG.gng, isTest = phase === 'test', thr = CONFIG.masteryThreshold, MOD = 'M1_GoNoGo';
  stage.innerHTML = `<div class="gng">
    <div class="hud"><span class="mod-timer" id="mt"></span><span class="lvl-tag" id="lt"></span></div>
    <div class="dots" id="dots"></div>
    <h2 class="instr-line">Tocca solo quando vedi "!"</h2>
    <div class="stim-wrap"><svg class="ring" viewBox="0 0 200 200"><circle cx="100" cy="100" r="94" class="ring-bg"/><circle cx="100" cy="100" r="94" class="ring-fg" id="rf"/></svg>
      <div class="stim idle" id="st"><span id="stt"></span></div></div></div>`;
  const dotsEl = $('#dots', stage), rf = $('#rf', stage), stEl = $('#st', stage), stt = $('#stt', stage), lt = $('#lt', stage), mt = $('#mt', stage);
  const CIRC = 2 * Math.PI * 94; rf.style.strokeDasharray = CIRC;
  r.every(() => { mt.textContent = 'Tempo ' + fmt(limit - r.now()); });

  let level = 0, block = [], trial = 0, state = 'idle', tap = null;
  let hits = 0, omis = 0, comm = 0, cr = 0; const rts = [];
  stage.addEventListener('pointerdown', e => {
    if (r.paused) return;
    const t = evtTime(e);
    if (state === 'stim' && !tap) tap = { t };
    else if (state === 'isi') Telemetry.log({ module: MOD, phase, level: level + 1, event: 'anticipation_tap', error_type: 'anticipation' });
  });
  const mkSeq = () => { const nGo = Math.round(C.trialsPerBlock * C.goProb); return shuffle([...Array(nGo).fill(true), ...Array(C.trialsPerBlock - nGo).fill(false)]); };
  let seq = mkSeq();
  const setStim = (txt, cls) => { stt.textContent = txt; stEl.className = 'stim ' + cls; };
  const draw = () => { renderDots(dotsEl, block, C.trialsPerBlock - block.length); lt.textContent = `Livello ${level + 1}/3`; };
  draw();

  while (r.now() < limit) {
    const lv = C.levels[level];
    state = 'isi'; setStim('', 'idle'); rf.style.strokeDashoffset = 0;
    await r.wait(rand(lv.isi[0], lv.isi[1]));
    if (r.now() >= limit) break;
    const isGo = seq[block.length];
    tap = null; setStim(isGo ? '!' : 'A', 'show');
    const onset = await nextFrame();            // istante del frame di comparsa
    state = 'stim';
    const got = await r.waitUntil(lv.stim, () => tap, f => { rf.style.strokeDashoffset = CIRC * f; });
    state = 'idle';
    let correct, type, rt = null;
    if (isGo) { if (got) { correct = true; type = 'hit'; rt = got.t - onset; hits++; rts.push(rt); } else { correct = false; type = 'omission'; omis++; } }
    else { if (got) { correct = false; type = 'commission'; rt = got.t - onset; comm++; } else { correct = true; type = 'correct_rejection'; cr++; } }
    trial++;
    Telemetry.log({ module: MOD, phase, level: level + 1, trial, event: type, stimulus: isGo ? 'GO(!)' : 'NOGO(A)', response: got ? 'tap' : 'none',
                    correct: correct ? 1 : 0, rt_ms: rt, error_type: correct ? '' : type, value: lv.stim });
    setStim(isGo ? '!' : 'A', correct ? 'good' : 'bad');
    block.push(correct); draw();
    await r.wait(380);

    if (block.length >= C.trialsPerBlock) {
      const acc = block.filter(Boolean).length / block.length;
      Telemetry.log({ module: MOD, phase, level: level + 1, event: 'block_end', value: acc.toFixed(2), correct: acc >= thr ? 1 : 0 });
      if (isTest) {
        if (acc >= thr) {
          if (level < C.levels.length - 1) { Progress.pass(level); await naoSay(MSG_OK(level + 1) + ' Ora i simboli saranno un po\' più veloci.', 'happy'); level++; }
          else { Progress.pass(level); await naoSay('Bravissimo! Hai completato tutti i livelli!', 'happy'); break; }
        } else { await naoSay(MSG_RETRY, 'calm', 'Riproviamo'); }   // checkpoint: si ripete lo stesso livello
        App.setSeg(3, level);
        Telemetry.log({ module: MOD, phase, level: level + 1, event: 'level_set' });
      }
      block = []; seq = mkSeq(); draw();
    }
  }
  const mean = rts.length ? (rts.reduce((a, b) => a + b, 0) / rts.length).toFixed(0) : '–';
  return { lines: [['Livello raggiunto', level + 1], ['"!" toccati correttamente', hits], ['Errori di commissione', comm], ['Errori di omissione', omis], ['Inibizioni corrette', cr], ['TR medio (ms)', mean]] };
}

/* =====================================================================
   10. MODULO 2 – ATTRAVERSA LA STRADA (Frogger visuo-spaziale)
   ===================================================================== */

  stage.innerHTML = `<div class="frog">
    <div class="hud"><span class="mod-timer" id="mt"></span><span class="lvl-tag" id="lt"></span></div>
    <div class="dots" id="dots"></div>
    <div class="cw" id="cw"><canvas id="cv"></canvas></div>
    <div class="frog-ctrl ${C.padSide === 'left' ? 'left' : 'right'}"><div class="dpad">
      <button class="arrow-btn u" data-d="up" aria-label="Su">${ICO.up}</button>
      <button class="arrow-btn l" data-d="left" aria-label="Sinistra">${ICO.left}</button>
      <button class="arrow-btn d" data-d="down" aria-label="Giù">${ICO.down}</button>

  const cv = $('#cv', stage), ctx = cv.getContext('2d'), cw = $('#cw', stage), dotsEl = $('#dots', stage), mt = $('#mt', stage), lt = $('#lt', stage);
  r.every(() => { mt.textContent = 'Tempo ' + fmt(limit - r.now()); });
  const COLORS = ['#F97316','#EAB308','#EF4444','#A855F7','#06B6D4','#F43F5E','#84CC16'];

  function rectFor(d, l0, len) { const cs = G.cs, s = toScr(d, 0); return G.vert ? { x: l0 * cs, y: s.r * cs, w: len * cs, h: cs } : { x: s.c * cs, y: l0 * cs, w: cs, h: len * cs }; }

    const cfg = C.levels[level], o = cfg.dir, L = cfg.lanes, D = L + 2, vert = (o === 'up' || o === 'down'), lanes = [];
    const roadIdx = [...Array(L).keys()].map(i => i + 1).filter(d => !(cfg.water || []).includes(d));
    const slowLane = cfg.slowSpeed && roadIdx.length ? pick(roadIdx) : -1;        // una corsia di auto più lenta

      if (water) {   // corsia d'acqua: tronchi lenti su cui saltare

        lanes.push({ d, type: 'water', dir, speed, span, objs });

        for (let k = 0; k < cfg.cars; k++) objs.push({ pos: k * span / cfg.cars + rand(0, .8) - 1, len: Math.random() < cfg.truck ? 2 : 1, color: pick(COLORS) });

          frog: { d: 0, l: Math.floor(W / 2) }, ok: 0, err: 0, att: [], t0: r.now(), flash: null, cs: 30 };
    resize(); drawDots(); lt.textContent = `Livello ${level + 1}/${NL}`;
    Telemetry.log({ module: MOD, phase, level: level + 1, event: 'level_start', notes: `orientation=${o};lanes=${L};slowLane=${slowLane};water=${(cfg.water || []).join('|') || 'none'};pond=${cfg.pond};padL=${G.padL}` });
  }
  function resize() {
    if (!G) return;
    const cs = Math.max(18, Math.floor(Math.min((cw.clientWidth - 16) / G.cols, (cw.clientHeight - 24) / G.rows)));
    const dpr = window.devicePixelRatio || 1; G.cs = cs;
    cv.width = G.cols * cs * dpr; cv.height = G.rows * cs * dpr; cv.style.width = G.cols * cs + 'px'; cv.style.height = G.rows * cs + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); r.onDestroy(() => window.removeEventListener('resize', resize));
  const drawDots = () => renderDots(dotsEl, G.att, C.target - G.ok);
  const resetFrog = () => { G.frog = { d: 0, l: Math.floor(W / 2) }; G.t0 = r.now(); };

    Telemetry.log({ module: MOD, phase, level: level + 1, trial: G.att.length, event: 'collision', correct: 0, error_type: kind, rt_ms: r.now() - G.t0, x: +G.frog.l.toFixed(2), y: G.frog.d });

      if (ln.dir < 0 && o.pos < -o.len) o.pos += ln.span;

      const R = rectFor(d, 0, W), water = d > 0 && d < G.D - 1 && G.lanes[d - 1].type === 'water';
      ctx.fillStyle = d === 0 ? '#8BCF8E' : d === G.D - 1 ? '#5AA9E6' : water ? '#3F86D1' : '#5A6378';
      ctx.fillRect(R.x, R.y, R.w, R.h);
      if (water) { ctx.fillStyle = 'rgba(255,255,255,.18)'; for (let l = 0; l < W; l++) { const q = rectFor(d, l + .25, .5); if (G.vert) ctx.fillRect(q.x, q.y + q.h * .46, q.w, q.h * .08); else ctx.fillRect(q.x + q.w * .46, q.y, q.w * .08, q.h); } }
    }
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = Math.max(2, cs * .05); ctx.setLineDash([cs * .3, cs * .25]);

      if (G.vert) { const y = Math.max(A.y, B.y); ctx.moveTo(0, y); ctx.lineTo(Wp, y); } else { const x = Math.max(A.x, B.x); ctx.moveTo(x, 0); ctx.lineTo(x, Hp); }

    ctx.fillText('🐸', fr.x + cs / 2, fr.y + cs / 2 + cs * .04);

}

/* =====================================================================
   11. MODULO 3 – OCCHIO AL PUNTATORE (tracking continuo, 3 × 30 s)
   ===================================================================== */
async function runTrack(r, stage, phase, limit) {
  /* Livello 1: inseguimento continuo del cerchio con il dito.
     Livello 2: il cerchio compare in punti casuali → toccarlo (TR, omissioni).
     Livello 3: come L2 + oggetti distrattori che compaiono e spariscono da soli → non toccarli (commissioni).
     Ogni livello dura 30 s; ≥ 80% → livello successivo, altrimenti si ripete lo stesso livello (checkpoint).
     Il modulo termina comunque allo scadere di 1 min 30 s. */
  const C = CONFIG.track, isTest = phase === 'test', MOD = 'M3_Tracking', R = C.radius, thr = CONFIG.masteryThreshold;
  stage.innerHTML = `<div class="track"><div class="hud"><span class="lvl-tag" id="lt"></span><span class="mod-timer" id="mt"></span></div>
    <h2 class="instr-line" id="ti"></h2><div class="cw" id="cw"><canvas id="cv"></canvas></div></div>`;
  const cv = $('#cv', stage), ctx = cv.getContext('2d'), cw = $('#cw', stage), ti = $('#ti', stage), lt = $('#lt', stage), mt = $('#mt', stage);
  let Wc = 0, Hc = 0;
  const resize = () => { const w = cw.clientWidth, h = cw.clientHeight; if (w === Wc && h === Hc) return; Wc = w; Hc = h; const dpr = window.devicePixelRatio || 1; cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };

  cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {} const q = pos(e); Object.assign(P, q, { down: true, t: evtTime(e) }); if (!r.paused) taps.push({ ...q, t: evtTime(e) }); });

    const meanRT = st.rts.length ? (st.rts.reduce((a, c) => a + c, 0) / st.rts.length).toFixed(1) : '';

/* Genera una griglia risolvibile: partenza → oggetti in ordine (A, B, C…) → uscita,

/* Esegue un singolo modulo; restituisce il riepilogo o null se interrotto */
async function launch(def) {
  App.stopCurrent(); Study.ensure(); const tok = App.token; App.mod = def.id;
  App.activeRun = { id: `${Telemetry.sessionId}-${def.id}-${++App.runCount}-${Math.random().toString(36).slice(2, 6)}`, passes: 0 };   // nuovo svolgimento
  App.setTitle(def.title); App.setSeg(def.levels, 0); App.nav(def.nav || 'home');
  const main = $('#main');
  const makeStage = () => { main.innerHTML = '<div class="stage"></div>'; return $('.stage', main); };
  try {
    await screenInstructions(main, def); if (tok !== App.token) return null;
    if (def.practice) {
      Telemetry.log({ module: def.id, phase: 'practice', event: 'phase_start' });
      const r = App.newRunner(), stage = makeStage();
      const p = def.run(r, stage, 'practice', CONFIG.practiceMs);
      stage.insertAdjacentHTML('beforeend', '<span class="practice-tag">PROVA</span>');
      await p; r.destroy(); if (tok !== App.token) return null;
      Telemetry.log({ module: def.id, phase: 'practice', event: 'phase_end' });
      await screenReady(main); if (tok !== App.token) return null;
    }
    Telemetry.log({ module: def.id, phase: 'test', event: 'phase_start' });
    App.setSeg(def.levels, 0);
    const r = App.newRunner(), stage = makeStage();
    const sum = await def.run(r, stage, 'test', def.duration);
    const activeMs = r.now(); r.destroy(); App.runner = null;
    Telemetry.log({ module: def.id, phase: 'test', event: 'phase_end', rt_ms: activeMs, notes: sum.lines.map(l => l.join('=')).join(';') });
    if (tok === App.token) {
      Progress.done(def.id);
      const run = App.activeRun, st = runStats(Telemetry.rows.filter(x => x.run_id === run.id));
      await Coins.award(Coins.forGame(st, run.passes || 0), def.id);          // premio per lo sforzo
      if (tok === App.token) { App.activeRun = null; Archive.finish(run.id); }
    }
    return tok === App.token ? sum : null;
  } catch (e) { if (e !== CANCEL) console.error(e); return null; }
}

/* =====================================================================
   ARCHIVIO RISULTATI
   Ogni partita (un gioco svolto, prova + test) è un "svolgimento" con un
   proprio codice run_id. A fine partita (o se viene interrotta) viene
   salvata nell'archivio:
   - app pubblicata su claude.ai → nel tuo account (spazio privato, visibile
     solo a te), quindi resta anche se il browser cancella i suoi dati;
   - file aperto in locale → nella memoria del browser di quel dispositivo.
   ===================================================================== */
const SECTION_LABEL = { checkin: 'Come ti senti', sezione1: 'Allenamento cognitivo', sezione2: 'Aiuta NAO', scelta_libera: 'Scelta libera' };
const MOD_TITLE = id => ({ M4_VisualSearch: 'Ricerca visiva', CHECKIN: 'Check-in emotivo' }[id] || ([...MODULES, SNAKE].find(m => m.id === id) || {}).title || id);
const runKeyOf = r => r.run_id || `L-${r.session_id}-${r.module}-${r.run_mode || 'na'}`;
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);

/* Statistiche di uno svolgimento, calcolate dalle sue righe di telemetria */
function runStats(rows) {
  const s = { trials: 0, correct: 0, rtSum: 0, rtN: 0, commission: 0, omission: 0, otherErrors: 0, levelReached: 0, durationMs: 0, completed: false };
  let t0 = null, t1 = null;
  for (const r of rows) {
    const t = parseFloat(r.t_session_ms); if (!isNaN(t)) { if (t0 === null || t < t0) t0 = t; if (t1 === null || t > t1) t1 = t; }
    if (r.phase === 'test' && r.level) s.levelReached = Math.max(s.levelReached, +r.level || 0);
    if (r.phase === 'test' && r.event === 'phase_end') { s.completed = true; if (r.rt_ms) s.durationMs = parseFloat(r.rt_ms); }
    if (r.phase !== 'test' || !TRIAL_EV.has(r.event)) continue;
    s.trials++;
    if (String(r.correct) === '1') { s.correct++; if (r.rt_ms !== undefined && r.rt_ms !== '' && r.rt_ms !== null) { s.rtSum += parseFloat(r.rt_ms); s.rtN++; } }
    else if (r.error_type === 'commission' || r.error_type === 'collision') s.commission++;
    else if (r.error_type === 'omission') s.omission++;
    else s.otherErrors++;
  }
  if (!s.durationMs && t0 !== null) s.durationMs = t1 - t0;
  return { trials: s.trials, correct: s.correct, accuracy: s.trials ? s.correct / s.trials : null, meanRT: s.rtN ? s.rtSum / s.rtN : null,
           commission: s.commission, omission: s.omission, otherErrors: s.otherErrors, levelReached: s.levelReached, durationMs: Math.round(s.durationMs), completed: s.completed };
}
function runMeta(id, rows) {
  const f = rows[0] || {}, l = rows[rows.length - 1] || {};
  const m = { runId: id, sessionId: f.session_id || '', participant: f.participant_id || '', section: f.run_mode || '', module: f.module || '',
           title: MOD_TITLE(f.module), startedAt: f.wall_clock_iso || '', endedAt: l.wall_clock_iso || '', rowCount: rows.length, ...runStats(rows) };
  if (f.module === 'CHECKIN') {                     // riepilogo del check-in emotivo
    const ev = k => rows.filter(r => r.event === k), last = k => { const a = ev(k); return a.length ? a[a.length - 1] : null; };
    const pick = k => { const r = last(k); return r ? { v: r.value, l: r.response, tags: r.notes || '' } : null; };
    m.checkin = { energy: pick('energy'), frustration: pick('frustration'), school: pick('school'), week: pick('week'),
      talks: ev('talk_offer').map(r => `${r.stimulus}: ${r.response}`).join(' · '),
      recs: ev('talk_recording').filter(r => r.value).map(r => ({ id: r.value, topic: r.stimulus, text: r.notes || '' })) };
  }
  return m;
}
function groupLocal(rows) {
  const g = new Map();
  for (const r of rows) { if (r.module === 'APP' || !r.module) continue; const k = runKeyOf(r); if (!g.has(k)) g.set(k, []); g.get(k).push(r); }
  return g;
}

const Archive = {
  mode: 'local', runsCol: null, lastError: '', saved: new Set(),
  async init() {
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      this.runsCol = db.doc(`data/users/${uid}/archive`).collection('runs');
      this.mode = 'db';
      await this.recover();
    } catch (e) { this.mode = 'local'; this.runsCol = null; }
  },
  /* Salva nell'archivio le righe di uno svolgimento (prima i blocchi di dati, poi la scheda riassuntiva) */
  async push(id, rows) {
    if (this.mode !== 'db' || !rows.length) return false;
    const fields = Telemetry.storeFields(), ref = this.runsCol.doc(id), meta = runMeta(id, rows);
    const chunks = []; let cur = [], size = 0;
    for (const r of rows) { const a = fields.map(k => r[k] === undefined || r[k] === null ? '' : String(r[k])); const n = JSON.stringify(a).length; if (size + n > 150000 && cur.length) { chunks.push(cur); cur = []; size = 0; } cur.push(a); size += n; }
    if (cur.length) chunks.push(cur);
    try {
      for (let k = 0; k < chunks.length; k++) await ref.collection('chunks').doc('c' + String(k).padStart(4, '0')).set({ k, rows: chunks[k] });
      await ref.set({ ...meta, fields, chunks: chunks.length, savedAt: new Date().toISOString() });
      this.saved.add(id); this.lastError = ''; return true;
    } catch (e) {
      this.lastError = e && e.code === 'quota_exceeded' ? 'Archivio pieno: scarica i dati e libera spazio.' : 'Non è stato possibile salvare nell\'archivio: i dati restano su questo dispositivo.';
      return false;
    }
  },
  /* Fine (o interruzione) di uno svolgimento */
  async finish(id) { if (!id) return; await this.push(id, Telemetry.rows.filter(r => r.run_id === id)); },
  /* All'avvio: carica nell'archivio gli svolgimenti di sessioni precedenti rimasti solo sul dispositivo, poi li toglie dalla memoria locale */
  async recover() {
    const g = groupLocal(Telemetry.rows.filter(r => r.session_id !== Telemetry.sessionId)); const done = new Set();
    for (const [id, rows] of g) {
      try { const d = await withTimeout(this.runsCol.doc(id).get(), 10000); if (d.exists || await this.push(id, rows)) done.add(id); } catch (e) {}
    }
    if (done.size) { Telemetry.rows = Telemetry.rows.filter(r => r.session_id === Telemetry.sessionId || (r.module !== 'APP' && !done.has(runKeyOf(r)))); Telemetry.scheduleSave(); }
  },
  /* Elenco degli svolgimenti (archivio + questa sessione) */
  async list() {
    const local = groupLocal(Telemetry.rows), out = new Map();
    if (this.mode === 'db') {
      const snap = await withTimeout(this.runsCol.orderBy('startedAt', 'desc').limit(1000).get(), 12000);
      for (const d of snap.docs) { const m = d.data(); out.set(m.runId, { ...m, source: 'archivio' }); }
    }
    for (const [id, rows] of local) {
      const m = runMeta(id, rows), inArch = out.has(id);
      if (!inArch || out.get(id).rowCount < rows.length) out.set(id, { ...m, source: inArch ? 'archivio' : (this.mode === 'db' ? 'dispositivo' : 'locale'), live: App.activeRun && App.activeRun.id === id });
    }
    return [...out.values()].sort((a, b) => (b.startedAt || '').localeCompare(a.startedAt || ''));
  },
  /* Righe complete di uno svolgimento (dal dispositivo se presenti, altrimenti dall'archivio) */
  async rows(run) {
    const local = Telemetry.rows.filter(r => runKeyOf(r) === run.runId);
    if (local.length >= (run.rowCount || 0) || this.mode !== 'db') return local;
    const snap = await withTimeout(this.runsCol.doc(run.runId).collection('chunks').get(), 15000);
    const fields = run.fields || Telemetry.storeFields(), out = [];
    snap.docs.map(d => d.data()).sort((a, b) => a.k - b.k).forEach(c => c.rows.forEach(a => { const o = {}; fields.forEach((k, i) => { o[k] = a[i]; }); out.push(o); }));
    return out;
  }
};

}
const passFilter = r => ResultsUI.filter === 'all' || r.section === ResultsUI.filter;
const pc = v => v === null || v === undefined ? '–' : Math.round(v * 100) + '%';
const ms = v => v === null || v === undefined ? '–' : Math.round(v) + ' ms';
const dur = v => { if (!v) return '–'; const s = Math.round(v / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const when = iso => { try { return new Date(iso).toLocaleString('it-IT', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return iso; } };

function drawResults() {
  const body = $('#resBody'); if (!body) return;
  const runs = ResultsUI.runs.filter(passFilter);
  if (!runs.length) { body.innerHTML = '<div class="res-empty"><b>Ancora nessun risultato in questa sezione.</b><p class="meta">Ogni gioco completato o interrotto compare qui con data, livello raggiunto, accuratezza e tempi di reazione.</p></div>'; return; }
  /* Andamento per gioco (dal più vecchio al più recente) */
  const games = runs.filter(r => r.module !== 'CHECKIN'), cks = runs.filter(r => r.module === 'CHECKIN');
  const byMod = new Map();
  [...games].reverse().forEach(r => { if (!byMod.has(r.module)) byMod.set(r.module, []); byMod.get(r.module).push(r); });
  const trend = [...byMod].map(([m, rs]) => {
    const acc = rs.filter(r => r.accuracy !== null && r.accuracy !== undefined), last = rs[rs.length - 1];
    const spark = acc.slice(-10).map(r => `<i style="height:${Math.max(6, Math.round(r.accuracy * 100))}%" title="${pc(r.accuracy)}"></i>`).join('');
    return `<tr><td>${escHtml(MOD_TITLE(m))}</td><td>${rs.length}</td><td>${rs.filter(r => r.completed).length}</td><td>${Math.max(...rs.map(r => r.levelReached || 0)) || '–'}</td>
      <td>${pc(last.accuracy)}</td><td>${acc.length ? pc(acc.reduce((a, r) => a + r.accuracy, 0) / acc.length) : '–'}</td><td>${ms(last.meanRT)}</td><td><span class="spark">${spark}</span></td></tr>`;
  }).join('');
  /* Svolgimenti raggruppati per sessione */
  const bySess = new Map();
  games.forEach(r => { if (!bySess.has(r.sessionId)) bySess.set(r.sessionId, []); bySess.get(r.sessionId).push(r); });
  const sessions = [...bySess].map(([sid, rs]) => `<section class="sess">

async function downloadRuns(list, name, btn) {
  if (!list.length) return;
  const label = btn ? btn.textContent : ''; if (btn) { btn.disabled = true; btn.textContent = 'Preparo…'; }
  try {
    const rows = []; for (const r of [...list].sort((a, b) => (a.startedAt || '').localeCompare(b.startedAt || ''))) rows.push(...await Archive.rows(r));
    await Telemetry.download(rows, name.replace(/[^\w.-]+/g, '_'));
  } catch (e) { const w = $('#resErr'); if (w) { w.hidden = false; w.textContent = 'Non sono riuscita a recuperare questi dati dall\'archivio. Riprova tra poco.'; } }
  finally { if (btn) { btn.disabled = false; btn.textContent = label; } }
}

/* =====================================================================
   SUONI (Web Audio, nessun file esterno): "cling!" delle monetine e piccole melodie
   ===================================================================== */
const Sfx = {
  ctx: null,
  ac() { if (!Settings.sound) return null; try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; } catch (e) { return null; } },
  tone(f, t0, dur, vol = .18, type = 'sine') {
    const c = this.ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, c.currentTime + t0); g.gain.linearRampToValueAtTime(vol, c.currentTime + t0 + .005);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + t0 + dur);
    o.connect(g).connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + .05);
  },
  cling(delay = 0) { this.tone(1975, delay, .35, .16); this.tone(2637, delay + .06, .5, .14); this.tone(3951, delay + .06, .25, .05); },
  tune(notes, step = .16) { notes.forEach((f, i) => this.tone(f, i * step, step * 1.6, .14, 'triangle')); },
  tap() { this.tone(880, 0, .08, .06); }
};

function coinBurst(n) {

/* =====================================================================
   REGISTRAZIONE (audio + trascrizione) e archivio audio nel dispositivo (IndexedDB)
   ===================================================================== */
const AudioStore = {
  db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => { try { const r = indexedDB.open('naolab_audio', 1); r.onupgradeneeded = () => r.result.createObjectStore('rec'); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async put(id, val) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('rec', 'readwrite'); t.objectStore('rec').put(val, id); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async get(id) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('rec'); const q = t.objectStore('rec').get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
};
const Recorder = {
  supported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); },
  sttSupported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  async start(onText) {
    this.chunks = []; this.text = ''; this.interim = ''; this.t0 = performance.now(); this.on = true;
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'], type = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    this.mr = new MediaRecorder(this.stream, type ? { mimeType: type } : undefined);
    this.mr.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.mr.start(1000);
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      const go = () => {
        if (!this.on) return;
        try {
          const sr = new SR(); this.sr = sr; sr.lang = 'it-IT'; sr.continuous = true; sr.interimResults = true;
          sr.onresult = e => { let fin = '', tmp = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t + ' '; else tmp += t; } if (fin) this.text += fin; this.interim = tmp; onText && onText(this.text + this.interim); };
          sr.onend = () => { if (this.on) setTimeout(go, 250); };     // si riavvia da solo dopo le pause
          sr.onerror = () => {};
          sr.start();
        } catch (e) {}
      };
      go();
    }
  },
  stop() {
    return new Promise(res => {
      this.on = false; try { this.sr && this.sr.stop(); } catch (e) {}
      const done = () => { try { this.stream.getTracks().forEach(t => t.stop()); } catch (e) {} res({ blob: new Blob(this.chunks, { type: (this.mr && this.mr.mimeType) || 'audio/webm' }), text: (this.text + this.interim).trim(), ms: performance.now() - this.t0 }); };
      if (this.mr && this.mr.state !== 'inactive') { this.mr.onstop = done; this.mr.stop(); } else done();
    });
  }
};

    res => main.querySelectorAll('.ck-batt').forEach(b => b.addEventListener('click', () => { Sfx.tap(); b.classList.add('sel'); main.querySelectorAll('.ck-batt').forEach(x => x.disabled = true); res(FRUST.find(e => e.v === +b.dataset.v)); })));
  if (!alive()) return;
  log({ event: 'frustration', value: fr.v, response: fr.label, rt_ms: performance.now() - t0 }); await reply(fr.say); if (!alive()) return;

  /* scala a 5 parole (+ eventuale opzione extra e domande guidate) */
  const scaleStep = (step, q, extra, tags, evt) => {
    Voice.say(q); const ts = performance.now();
    return choose(step, ask(q) + `<div class="ck-scale">${SCALE.map(s => `<button class="ck-opt" data-v="${s.v}">${weatherSvg(s.w)}<span>${s.label}</span></button>`).join('')}</div>
      ${extra ? `<button class="chip ck-extra" data-v="0">${extra}</button>` : ''}
      ${tags ? `<div class="ck-tags" hidden><p class="ck-sub">Oggi a scuola… <small>(se vuoi, tocca quello che è successo)</small></p><div class="chips">${tags.map((t, i) => `<button class="chip" data-t="${i}">${t}</button>`).join('')}</div></div>` : ''}
      <p class="ck-reply" hidden></p><div class="ck-next" hidden><button class="btn go" id="ckNext">Avanti</button></div>`,
      res => {
        let pickd = null; const picked = new Set();
        const sel = async v => {
          pickd = v; Sfx.tap();
          main.querySelectorAll('.ck-opt,.ck-extra').forEach(x => x.classList.toggle('sel', +x.dataset.v === v));
          const s = SCALE.find(x => x.v === v); const r = $('.ck-reply', main); r.hidden = false; r.textContent = s ? s.say : 'Va bene!'; Voice.say(r.textContent);
          const tg = $('.ck-tags', main); if (tg) tg.hidden = v === 0;
          $('.ck-next', main).hidden = false;
        };
        main.querySelectorAll('.ck-opt,.ck-extra').forEach(b => b.addEventListener('click', () => sel(+b.dataset.v)));
        main.querySelectorAll('.ck-tags .chip').forEach(b => b.addEventListener('click', () => { Sfx.tap(); const i = +b.dataset.t; picked.has(i) ? picked.delete(i) : picked.add(i); b.classList.toggle('on', picked.has(i)); }));
        $('#ckNext', main).addEventListener('click', () => { Voice.cancel(); const s = SCALE.find(x => x.v === pickd);
          log({ event: evt, value: pickd, response: s ? s.label : extra, rt_ms: performance.now() - ts, notes: tags && pickd ? [...picked].map(i => tags[i]).join(' | ') : '' });
          res(pickd); });
      });
  };
  /* "Vuoi parlarne?" — sempre facoltativo */
  const talk = async (topic) => {
    Voice.say('Vuoi parlarne?');
    const yes = await new Promise(res => { main.innerHTML = ckFrame(CK_STEPS.indexOf(topic), `<div class="ck-ask"><div class="ck-nao">${naoHead('calm')}</div><h1>Vuoi parlarne?</h1></div>
      <p class="ck-sub">Se ti va, possiamo parlarne un po' insieme. Se non ti va, va benissimo lo stesso.</p>
      <div class="end-actions"><button class="btn go" id="tkYes">Sì, parliamone</button><button class="btn ghost-btn" id="tkNo">Non ne voglio parlare</button></div>`);
      $('#tkYes').addEventListener('click', () => res(true)); $('#tkNo').addEventListener('click', () => res(false)); });
    if (!alive()) return;
    log({ event: 'talk_offer', stimulus: topic, response: yes ? 'si' : 'no' });
    if (!yes) { Voice.say('Va benissimo! Andiamo avanti.'); return; }
    await talkScreen(topic, main, log);
  };

  /* 2. Scuola */
  const sc = await scaleStep(2, 'Com\'è andata la scuola oggi?', 'Oggi non c\'era scuola', SCHOOL_TAGS, 'school'); if (!alive()) return;
  if (TALK_AT.includes(sc)) { await talk('Scuola'); if (!alive()) return; }
  /* 3. Settimana */
  const wk = await scaleStep(3, 'Com\'è andata la settimana fino adesso?', null, null, 'week'); if (!alive()) return;
  if (TALK_AT.includes(wk)) { await talk('Settimana'); if (!alive()) return; }

  /* Fine: NAO ringrazia, monetine, giochi sbloccati */
  log({ event: 'phase_end' });
  App.setSeg(CK_STEPS.length, CK_STEPS.length);
  Progress.d.checkinDone = true; Progress.save();
  await Coins.award(COINS.checkin, 'check-in'); if (!alive()) return;
  const id = App.activeRun && App.activeRun.id; App.activeRun = null; Archive.finish(id);
  main.innerHTML = `<div class="end"><div class="nao-body">${naoBody('happy')}</div><h2>Grazie ${CONFIG.childName}!</h2><div class="bubble">Adesso giochiamo insieme!</div><button class="btn go" id="ckGo">Andiamo!</button></div>`;
  Voice.say(`Grazie ${NICE}! Adesso giochiamo insieme!`);
  $('#ckGo').addEventListener('click', () => { Voice.cancel(); renderHome(); });
}
/* Schermata della conversazione: registrazione audio + trascrizione + note facoltative */
function talkScreen(topic, main, log) {
  return new Promise(res => {
    const can = Recorder.supported();
    main.innerHTML = ckFrame(CK_STEPS.indexOf(topic), `<div class="talk"><div class="ck-ask"><div class="ck-nao">${naoHead('calm')}</div><h1>Parliamone insieme</h1></div>
      ${can ? `<button class="rec-btn" id="recBtn" aria-label="Avvia registrazione"><span class="rec-dot"></span></button><p class="meta" id="recState">Tocca il pulsante rosso per registrare la conversazione</p>`
            : `<p class="res-warn">La registrazione non è disponibile su questo dispositivo o in questo modo di apertura (serve il sito https, per esempio Cloudflare). Puoi scrivere qui sotto un riassunto.</p>`}
      <div class="transcript" id="trText" ${can ? '' : 'hidden'} aria-live="polite"></div>
      <label class="field">Note di ${escHtml(CONFIG.researcherName)} (facoltative)<textarea id="tkNotes" rows="3"></textarea></label>
      <div class="end-actions"><button class="btn go" id="tkDone">Abbiamo finito</button><button class="btn ghost-btn" id="tkStop">Non ne voglio parlare</button></div></div>`);
    let rec = false, recId = '';
    const finish = async (completed) => {
      let out = null; if (rec) { out = await Recorder.stop(); rec = false; } else { out = Recorder._last || null; } Recorder._last = null;
      const notes = scrubName($('#tkNotes').value.trim());
      if (out && out.blob.size) {
        recId = `${Telemetry.sessionId}-${topic}-${Date.now().toString(36)}`;
        try { await AudioStore.put(recId, { blob: out.blob, type: out.blob.type, session: Telemetry.sessionId, topic }); } catch (e) { recId = ''; }
      }
      log({ event: 'talk_recording', stimulus: topic, response: completed ? 'conclusa' : 'interrotta', value: recId, rt_ms: out ? out.ms : '', notes: scrubName(out ? out.text : '') });
      if (notes) log({ event: 'talk_notes', stimulus: topic, notes });
      Voice.say(completed ? 'Grazie per avermelo raccontato!' : 'Va benissimo! Andiamo avanti.');
      res();
    };
    if (can) $('#recBtn').addEventListener('click', async () => {
      const b = $('#recBtn'), st = $('#recState');
      if (!rec) {
        try { Voice.cancel(); await Recorder.start(t => { const el = $('#trText'); if (el) el.textContent = t; }); rec = true; b.classList.add('on'); st.textContent = Recorder.sttSupported() ? 'Sto registrando… la trascrizione compare qui sotto' : 'Sto registrando… (trascrizione automatica non disponibile in questo browser)'; }
        catch (e) { st.textContent = 'Non riesco ad accedere al microfono: controlla il permesso del browser.'; }
      } else { const o = await Recorder.stop(); rec = false; b.classList.remove('on'); b.disabled = true; st.textContent = 'Registrazione salvata. Tocca "Abbiamo finito" per andare avanti.'; Recorder._last = o; }
    });
    $('#tkDone').addEventListener('click', () => finish(true));
    $('#tkStop').addEventListener('click', () => finish(false));
  });
}

      <path d="M40 120 Q80 110 120 120 L114 226 Q80 238 46 226Z" fill="rgba(186,214,255,.28)" stroke="#2F6BEA" stroke-width="4"/>
      <g clip-path="url(#bodyClip)">${coins.join('')}</g>

    box.innerHTML = `<p>${text}</p><div class="sheet-actions"><button class="btn" data-a="1">${okLabel}</button><button class="btn ghost-btn" data-a="0">Annulla</button></div>`;
    card.prepend(box); card.scrollTop = 0;
    box.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; box.remove(); res(b.dataset.a === '1'); });
  });
}
function closeSheet() { const sh = $('#sheet'); sh.classList.remove('show'); sh.innerHTML = ''; if (App.sheetRunner) { App.sheetRunner.resume(); App.sheetRunner = null; } }

/* Area ricercatore: si apre SOLO con pressione lunga (2 s) sul cronometro
   oppure con Ctrl+Shift+E da tastiera. Non è visibile al bambino. */
function openResearcher() {
  const sum = summarize();
  const rows = Object.entries(sum).map(([m, s]) => `<tr><td>${m}</td><td>${s.n}</td><td>${s.c}</td><td>${s.n ? (100 * s.c / s.n).toFixed(0) + '%' : '–'}</td><td>${s.rtN ? (s.rt / s.rtN).toFixed(0) : '–'}</td><td>${s.comm}</td><td>${s.om}</td><td>${s.other}</td></tr>`).join('')
    || '<tr><td colspan="8">Nessun dato di test ancora registrato</td></tr>';
  const trk = Telemetry.rows.filter(r => r.module === 'M3_Tracking' && r.phase === 'test' && r.event === 'block_end').map(r => `L${r.level}: ${(parseFloat(r.value) * 100).toFixed(0)}%`).join(' · ');
  const last = Telemetry.rows.filter(r => r.event !== 'sample').slice(-40).reverse().map(r => `<tr><td>${r.t_session_ms}</td><td>${r.module || ''}</td><td>${r.phase || ''}</td><td>${r.level || ''}</td><td>${r.event || ''}</td><td>${r.correct ?? ''}</td><td>${r.rt_ms ?? ''}</td><td>${r.error_type || ''}</td></tr>`).join('');
  openSheet(`<div class="sheet-head"><h2>Area ricercatore</h2><button class="act" data-close aria-label="Chiudi">${ICO.close}</button></div>
    <p class="meta">Sessione ${Telemetry.sessionId} · ${Telemetry.rows.length} eventi · timer performance.now() · tempo sessione ${fmt(Study.elapsed())}</p>
    <label class="field">Codice partecipante (pseudonimo, mai il nome)<input id="pid" value="${escHtml(Settings.participant)}" placeholder="es. P01"></label>
    <label class="field">PIN della pagina Risultati (4 cifre)<input id="sPin" inputmode="numeric" maxlength="4" value="${escHtml(Settings.pin)}"></label>
    <label class="field">Durata massima della sessione (minuti, 0 = nessun limite)<input id="sMin" inputmode="numeric" value="${Settings.sessionMin === null || Settings.sessionMin === undefined ? CONFIG.sessionMinutes : Settings.sessionMin}"></label>
    <label class="field">Carattere del testo<select id="sFont">${[['lexend', 'Lexend (consigliato, molto leggibile)'], ['atkinson', 'Atkinson Hyperlegible (lettere molto distinte)'], ['opendyslexic', 'OpenDyslexic']].map(([k, l]) => `<option value="${k}"${Settings.font === k ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="field">Voce di NAO<select id="sVoiceName">${Voice.list.length ? Voice.list.map(v => `<option value="${escHtml(v.name)}"${Voice.v && Voice.v.name === v.name ? ' selected' : ''}>${escHtml(v.name)}</option>`).join('') : '<option value="">Nessuna voce italiana trovata su questo dispositivo</option>'}</select></label>
    <label class="check"><input type="checkbox" id="sSound" ${Settings.sound ? 'checked' : ''}> Suoni (monetine "cling!" e melodie)</label>
    <label class="check"><input type="checkbox" id="sVoice" ${Settings.voice ? 'checked' : ''}> Voce di NAO (sintesi vocale italiana)</label>
    <label class="field">Separatore CSV<select id="sSep"><option value=","${Settings.sep === ',' ? ' selected' : ''}>Virgola (R, SPSS, Python)</option><option value=";"${Settings.sep === ';' ? ' selected' : ''}>Punto e virgola + decimali con virgola (Excel italiano)</option></select></label>
    <div class="sheet-actions"><button class="btn" id="x1">CSV Sezione 1</button><button class="btn" id="x2">CSV Sezione 2</button><button class="btn ghost-btn" id="xa">CSV completo (tutte le sessioni)</button></div>
    <h3>Riepilogo (fase di test)</h3>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Modulo</th><th>Prove</th><th>Corrette</th><th>Accuratezza</th><th>TR/tempo medio corrette (ms)</th><th>Commissione/collisioni</th><th>Omissione</th><th>Altri errori</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${trk ? `<p class="meta">Tracking – percentuale per blocco: ${trk}</p>` : ''}
    <h3>Ultimi eventi</h3>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>t (ms)</th><th>Modulo</th><th>Fase</th><th>Liv.</th><th>Evento</th><th>Corr.</th><th>RT (ms)</th><th>Errore</th></tr></thead><tbody>${last || '<tr><td colspan="8">–</td></tr>'}</tbody></table></div>
    <div class="sheet-actions"><button class="btn ghost-btn" id="sTest">Prova la voce</button><button class="btn ghost-btn" id="bReset">Azzera progressi</button><button class="btn ghost-btn" id="bClr">Cancella dati</button></div>`);
  $('#pid').addEventListener('input', e => { const v = scrubName(e.target.value.trim()); if (v) { Settings.participant = v; Settings.save(); } });
  $('#sPin').addEventListener('input', e => { const v = e.target.value.replace(/\D/g, '').slice(0, 4); e.target.value = v; if (v.length === 4) { Settings.pin = v; Settings.save(); } });
  $('#sMin').addEventListener('input', e => { const v = e.target.value.replace(/\D/g, ''); e.target.value = v; if (v !== '') { Settings.sessionMin = Math.min(240, +v); Settings.save(); } });
  $('#sFont').addEventListener('change', e => { Settings.font = e.target.value; Settings.save(); document.documentElement.dataset.font = Settings.font; });
  $('#sVoiceName').addEventListener('change', e => { Settings.voiceName = e.target.value; Settings.save(); Voice.v = Voice.list.find(v => v.name === Settings.voiceName) || Voice.v; Voice.say(`Ciao ${NICE}! Sono NAO.`); });
  $('#sSound').addEventListener('change', e => { Settings.sound = e.target.checked; Settings.save(); if (Settings.sound) Sfx.cling(); });
  $('#sVoice').addEventListener('change', e => { Settings.voice = e.target.checked; Settings.save(); });
  $('#sSep').addEventListener('change', e => { Settings.sep = e.target.value; Settings.save(); });
  $('#x1').addEventListener('click', () => Telemetry.exportSection(1));
  $('#x2').addEventListener('click', () => Telemetry.exportSection(2));
  $('#xa').addEventListener('click', () => Telemetry.exportAll());
  $('#sTest').addEventListener('click', () => Voice.say(`Ciao ${NICE}! Sono NAO. Bravissimo!`));
  $('#bReset').addEventListener('click', async () => { if (await askConfirm('Azzerare il progresso mostrato nella schermata principale?', 'Azzera')) { Progress.reset(); closeSheet(); renderHome(); } });
  $('#bClr').addEventListener('click', async () => { if (await askConfirm('Cancellare tutti i dati di telemetria registrati? L\'operazione non si può annullare.', 'Cancella')) { Telemetry.clear(); closeSheet(); openResearcher(); } });
}

/* =====================================================================
   17. AVVIO
   ===================================================================== */
function init() {
  /* Download nell'app pubblicata (null quando il file è aperto in locale) */
  App.downloads = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  Settings.load();
  if (!Settings.participant || scrubName(Settings.participant) !== Settings.participant) { Settings.participant = CONFIG.participantCode; Settings.save(); }
  document.documentElement.dataset.font = Settings.font || 'lexend';
  Telemetry.load(); Study.start(); Voice.init(); Progress.load(); Archive.init();
  $('#btnMenu').innerHTML = ICO.menu; $('#clockIco').innerHTML = ICO.clock;
  Coins.load();
  const nav = { home: ICO.home, nao: `<span class="nao-mini">${naoHead()}</span>`, coins: `<span class="coin-nav"><b id="coinBadge">${Coins.d.total}</b>${coinSvg(30)}</span>`, res: ICO.chart };
  document.querySelectorAll('.nav-btn').forEach(b => { b.innerHTML = nav[b.dataset.nav]; });
  $('#btnMenu').addEventListener('click', renderHome);
  document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => ({ nao: renderNaoSection, res: renderResults, coins: renderPiggy }[b.dataset.nav] || renderHome)()));
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
  /* Accesso nascosto all'area ricercatore */
  const cp = $('.clock-pill'); let lp = null;
  cp.addEventListener('pointerdown', () => { clearTimeout(lp); lp = setTimeout(openResearcher, 2000); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => cp.addEventListener(ev, () => clearTimeout(lp)));
  cp.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => { if (e.ctrlKey && e.shiftKey && (e.key === 'E' || e.key === 'e')) { e.preventDefault(); openResearcher(); } });
  /* Cronometro di sessione sempre attivo */
  const sw = $('#stopwatch');
  setInterval(() => {
    sw.textContent = fmt(Study.elapsed());
    const lim = Study.limitMs();
    if (Study.active && lim && Study.elapsed() >= lim) { endSession('tempo_scaduto'); screenSessionOver(true); }   // tempo massimo raggiunto
  }, 250);
  /* Pausa automatica se l'app va in background */
  document.addEventListener('visibilitychange', () => {
    const r = App.runner;
    if (document.hidden) { if (r && !App.hiddenRunner) { r.pause(); App.hiddenRunner = r; } }
    else if (App.hiddenRunner) { App.hiddenRunner.resume(); App.hiddenRunner = null; }
  });
  renderHome();
}
init();
</script>
